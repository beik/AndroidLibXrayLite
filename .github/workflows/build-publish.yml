name: Build and Publish libv2ray

on:
  workflow_dispatch:
    inputs:
      version:
        description: Maven version, for example 2.2.5-7-byedpi
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
      MAVEN_PUBLISH_TOKEN: ${{ secrets.MAVEN_PUBLISH_TOKEN }}
      GOPRIVATE: github.com/beik/*
      GONOSUMDB: github.com/beik/*

    steps:
      - name: Validate release version
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-[0-9]+-byedpi$ ]]

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Download and test Go dependencies
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          go test ./...

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
          gomobile init

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build libv2ray
        run: |
          gomobile bind -target android -androidapi 21 \
            -ldflags '-checklinkname=0 -extldflags=-Wl,-z,max-page-size=16384' \
            -tags 'with_quic,with_grpc,with_wireguard,with_utls,with_reality_server,with_docker,with_proxyprotocol' \
            ./
          test -s libv2ray.aar
          test -s libv2ray-sources.jar

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Publish to GitHub Packages
        run: |
          test -n "$MAVEN_PUBLISH_TOKEN"
          publish_dir=/tmp/libv2ray-publish
          mkdir -p "$publish_dir"
          cp libv2ray.aar libv2ray-sources.jar "$publish_dir/"

          pom="$publish_dir/libv2ray-${VERSION}.pom"
          printf '%s\n' \
            '<?xml version="1.0" encoding="UTF-8"?>' \
            '<project xmlns="http://maven.apache.org/POM/4.0.0">' \
            '  <modelVersion>4.0.0</modelVersion>' \
            '  <groupId>com.v2ray</groupId>' \
            '  <artifactId>libv2ray</artifactId>' \
            "  <version>${VERSION}</version>" \
            '  <packaging>aar</packaging>' \
            '</project>' > "$pom"
            
            base="https://maven.pkg.github.com/beik/singbox-android-libs/com/v2ray/libv2ray/${VERSION}"
            curl --fail-with-body -X PUT -H "Authorization: Bearer ${MAVEN_PUBLISH_TOKEN}" \
              --data-binary "@$pom" "$base/libv2ray-${VERSION}.pom"
            curl --fail-with-body -X PUT -H "Authorization: Bearer ${MAVEN_PUBLISH_TOKEN}" \
              --data-binary "@$publish_dir/libv2ray.aar" "$base/libv2ray-${VERSION}.aar"
            curl --fail-with-body -X PUT -H "Authorization: Bearer ${MAVEN_PUBLISH_TOKEN}" \
              --data-binary "@$publish_dir/libv2ray-sources.jar" "$base/libv2ray-${VERSION}-sources.jar"
